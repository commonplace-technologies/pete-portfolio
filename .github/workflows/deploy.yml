name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Org Linux pool. GitHub-hosted runners are disabled org-wide, so a job
    # pinned to ubuntu-latest queues forever with no runner and no error.
    runs-on: [self-hosted, lebowski]
    environment:
      name: production
      url: https://pete.bacus.org
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: pete-portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dev deps included: wrangler is one.
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # Idempotent: creates the Pages project on the first run, no-op after.
      # A bad token still fails loudly at the deploy step below.
      - name: Ensure Pages project exists
        run: npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
